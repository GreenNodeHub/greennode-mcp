[project]
name = "greennode.{{product}}-mcp-server"
version = "0.0.0"
description = "GreenNode MCP Server for {{PRODUCT}}"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "greennode.mcp-core",
    "mcp[cli]>=1.28.1",
    "starlette>=0.27.0",
    "pydantic>=2.10.6",
    "httpx>=0.27.0,<1.0",
]
license = {text = "Apache-2.0"}
authors = [
    {name = "Green Node"},
]

[project.optional-dependencies]
http = ["uvicorn>=0.30.0"]

[project.scripts]
"{{product}}-mcp-server" = "greennode.{{product_snake}}_mcp_server.server:main"

[tool.uv.sources]
"greennode.mcp-core" = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greennode"]

[tool.ruff]
line-length = 99
exclude = ["**/__pycache__", "**/dist", "**/build", "**/.ruff_cache", "**/.venv"]
force-exclude = true

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["C", "D", "E", "F", "I", "W"]
ignore = ["C901", "E501", "E741", "F402", "F823", "D100", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
lines-after-imports = 2
no-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
