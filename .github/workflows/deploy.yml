name: Deploy

# Builds and pushes the image to a registry, per GitHub Environment.
#
# Uses GitHub Environments so dev and production can have DIFFERENT registry
# config. Two environments (Settings → Environments): `develop` and
# `production` (environment names are decoupled from branch names).
#   develop    → vars.IMAGE_REGISTRY       e.g. vcr.vngcloud.vn/<dev-namespace>
#   production → vars.IMAGE_REGISTRY_PROD  e.g. vcr.vngcloud.vn/<prod-namespace>
# Both environments also need:
#   secrets.REGISTRY_USERNAME
#   secrets.REGISTRY_PASSWORD
# (Add production protection rules / required reviewers as desired.)
#
# Trunk-based triggers:
#   push to `main` touching this server's files (path filter below)
#        -> deploy to the `develop` environment   (image tag = <commit sha>)
#   push tag `v*`
#        -> deploy to the `production` environment (image tag = <git tag>)
#
# Notes:
# - Path filters are NOT evaluated for tag pushes, so `v*` tags always deploy.
# - If either environment restricts "Deployment branches and tags"
#   (Settings → Environments → <env>), it must allow `main` (develop env)
#   and `v*` tags (production env).
# - Do NOT gate on `vars.IMAGE_REGISTRY` in a job-level `if` — environment
#   variables are not reliably available there; the "Show target" step fails
#   loudly instead when the environment is misconfigured.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/vks-mcp-server/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-24.04
    # tag push -> production; main push -> develop
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'develop' }}
    env:
      TARGET_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'develop' }}
      # production reads IMAGE_REGISTRY_PROD; develop reads IMAGE_REGISTRY
      REGISTRY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.IMAGE_REGISTRY_PROD || vars.IMAGE_REGISTRY }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show target & verify environment config
        run: |
          echo "Environment: $TARGET_ENV"
          echo "Registry:    $REGISTRY"
          if [ -z "$REGISTRY" ]; then
            if [ "$TARGET_ENV" = "production" ]; then
              echo "::error::IMAGE_REGISTRY_PROD variable is empty. Set it in Settings → Environments → production → Variables."
            else
              echo "::error::IMAGE_REGISTRY variable is empty. Set it in Settings → Environments → develop → Variables."
            fi
            exit 1
          fi
          if [ -z "${{ secrets.REGISTRY_USERNAME }}" ] || [ -z "${{ secrets.REGISTRY_PASSWORD }}" ]; then
            echo "::error::REGISTRY_USERNAME / REGISTRY_PASSWORD secret is missing for this environment."
            exit 1
          fi

      - name: Compute image tag
        id: meta
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -f src/vks-mcp-server/Dockerfile -t "$REGISTRY/greennode-vks-mcp:${{ steps.meta.outputs.tag }}" .

      - name: Push image
        run: docker push "$REGISTRY/greennode-vks-mcp:${{ steps.meta.outputs.tag }}"
