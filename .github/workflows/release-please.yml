name: Release Please

# Per-package release automation (manifest mode). On every push to main it
# maintains a "release PR" per package that accumulates Conventional Commits
# into a version bump + CHANGELOG. Merging that PR creates the tag
# `<component>-vX.Y.Z` (e.g. vks-mcp-server-v0.5.0), which triggers the
# production deploy in deploy.yml.
#
# NOTE: with the default GITHUB_TOKEN, required checks won't start on the
# release PR automatically (GitHub safeguard) — close & reopen it once. Set
# the RELEASE_PLEASE_TOKEN secret (fine-grained PAT: contents + pull-requests
# write) to remove this friction.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Optional fine-grained PAT (contents: write, pull-requests: write).
          # With a PAT, required checks start automatically on the release PR
          # (no close/reopen needed). Falls back to GITHUB_TOKEN when unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tags created with GITHUB_TOKEN do not trigger push workflows, so
      # dispatch the deploy explicitly for each released package that has a
      # deploy pipeline (workflow_dispatch is exempt from that restriction).
      - name: Dispatch production deploy for released tags
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUTS: ${{ toJson(steps.release.outputs) }}
        run: |
          printf '%s' "$OUTPUTS" > outputs.json
          for path in $(jq -r '.paths_released | fromjson | .[]' outputs.json); do
            tag=$(jq -r --arg p "$path" '.[$p + "--tag_name"] // empty' outputs.json)
            [ -z "$tag" ] && continue
            case "$tag" in
              vks-mcp-server-v*)
                echo "Dispatching deploy for $tag"
                gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
                ;;
              *)
                echo "No deploy configured for $tag — skipping"
                ;;
            esac
          done
