name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  FORCE_COLOR: 1

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --all-groups
      - name: Lint (ruff)
        working-directory: src/vks-mcp-server
        run: uv run ruff check .
      - name: Format check (ruff)
        working-directory: src/vks-mcp-server
        run: uv run ruff format --check .
      - name: Tests
        working-directory: src/vks-mcp-server
        run: uv run pytest tests/ -q

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f src/vks-mcp-server/Dockerfile -t greennode-vks-mcp:ci .
