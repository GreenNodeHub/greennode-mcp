# Kubernetes Deployment template (placeholders substituted by generate_app_manifest)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: __APP_NAME__
spec:
  replicas: __REPLICAS__
  selector:
    matchLabels:
      app.kubernetes.io/name: __APP_NAME__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __APP_NAME__
    spec:
      containers:
      - name: __APP_NAME__
        image: __IMAGE_URI__
        imagePullPolicy: Always
        ports:
        - containerPort: __PORT__
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        resources:
          requests:
            cpu: __CPU__
            memory: __MEMORY__
          limits:
            cpu: __CPU__
            memory: __MEMORY__
