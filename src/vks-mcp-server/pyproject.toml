[project]
name = "greennode.vks-mcp-server"
version = "0.6.0"
description = "GreenNode MCP Server for VNG Kubernetes Service (VKS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "greennode.mcp-core",
    "mcp[cli]>=1.28.1",
    "starlette>=0.27.0",
    "pydantic>=2.10.6",
    "httpx>=0.27.0,<1.0",
    "kubernetes>=28.1.0",
    "pyyaml>=6.0.0",
    "cachetools>=5.3.0",
]
license = {text = "Apache-2.0"}
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Green Node"},
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
http = ["uvicorn>=0.30.0", "pyjwt[crypto]>=2.13.0"]

[project.urls]
homepage = "https://github.com/vngcloud/greennode-mcp"
repository = "https://github.com/vngcloud/greennode-mcp.git"
changelog = "https://github.com/vngcloud/greennode-mcp/blob/main/src/vks-mcp-server/CHANGELOG.md"

[project.scripts]
"vks-mcp-server" = "greennode.vks_mcp_server.server:main"

[dependency-groups]
dev = [
    "commitizen>=4.2.2",
    "pre-commit>=4.1.0",
    "ruff>=0.9.7",
    "pyright>=1.1.398",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
"greennode.mcp-core" = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["greennode"]
# Non-Python files (e.g. templates/) under the package are included automatically;
# a force-include here would double-add them and break the wheel build.

[tool.ruff]
line-length = 99
exclude = [
    ".venv",
    "**/__pycache__",
    "**/dist",
    "**/build",
    "**/.ruff_cache",
    "**/.venv",
]
force-exclude = true

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["C", "D", "E", "F", "I", "W"]
ignore = ["C901", "E501", "E741", "F402", "F823", "D100", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
lines-after-imports = 2
no-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["greennode", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/dist", "**/build"]
reportAttributeAccessIssue = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "greennode/vks_mcp_server/__init__.py:__version__"
]
update_changelog_on_bump = true

[tool.bandit]
exclude_dirs = ["venv", ".venv", "tests"]

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests that make live API calls (deselect with '-m \"not live\"')",
    "asyncio: marks tests that use asyncio",
]

[tool.coverage.report]
exclude_also = [
    'pragma: no cover',
    'if __name__ == .__main__.:\n    main()',
]

[tool.coverage.run]
source = ["greennode"]
